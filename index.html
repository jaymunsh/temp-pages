<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>temp-pages</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{color-scheme:light;--paper:#F4F4F1;--ink:#1E2430;--soft:#5A6272;--faint:#8A8F9C;--rule:#DCDDD7;--accent:#2E4272}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.8}
.wrap{max-width:640px;margin:0 auto;padding:80px 24px 96px}
h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:12px;
  letter-spacing:.1em;margin:0 0 40px}
ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule)}
li{border-bottom:1px solid var(--rule)}
a{display:block;padding:18px 4px;text-decoration:none;color:inherit}
a:hover{background:#fff}
b{display:block;font-size:16px;color:var(--accent)}
span{display:block;font-size:13.5px;color:var(--soft);margin-top:2px}
footer{margin-top:48px;font-size:12px;color:var(--faint)}
</style>
<div class="wrap">
  <h1>temp-pages</h1>
  <p class="sub">STATIC PAGES</p>
  <ul>
    <li><a href="./criminal-complaint/"><b>고소장 처음 쓰는 사람을 위한 안내</b>
      <span>고소권자 확인부터 제출 후 불복 절차까지, 경찰청 공식 서식 기준 8단계 안내</span></a></li>
    <li><a href="./marriage-broker-refund/"><b>국제결혼중개 비용 반환 청구</b>
      <span>중개업체에 보내는 내용증명 — 상황 정리, 문서 초안, 발송법, 후속 절차</span></a></li>
  </ul>
  <footer>정적 페이지 모음.</footer>
</div>

</body>
</html>
